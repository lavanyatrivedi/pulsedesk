<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PulseDesk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #0f1b33;
    --panel: #16233f;
    --accent: #4fd1c5;
    --accent2: #f6ad55;
    --text: #e6ecf5;
    --muted: #8fa1c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0a1220, #101c33);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--accent); }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  main {
    padding: 24px 32px;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 18px 20px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .card h2 {
    margin: 0 0 12px 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .price-row .price { font-size: 28px; font-weight: 700; }
  .change-pos { color: #4ade80; }
  .change-neg { color: #f87171; }
  .brief {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .events-panel {
    grid-column: 1 / -1;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    background: rgba(255,255,255,0.08);
  }
  .sent-pos { color: #4ade80; }
  .sent-neg { color: #f87171; }
  .sent-neu { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Pulse<span>Desk</span></h1>
  <select id="commoditySelect"></select>
</header>

<main>
  <div class="card">
    <h2>Price</h2>
    <canvas id="priceChart" height="110"></canvas>
  </div>

  <div class="card">
    <h2>Desk Brief</h2>
    <div class="price-row">
      <div class="price" id="latestPrice">--</div>
      <div id="changePct">--</div>
    </div>
    <div class="brief" id="briefText">Loading...</div>
  </div>

  <div class="card events-panel">
    <h2>Event Flow</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Category</th><th>Headline</th><th>Sentiment</th><th>5d Move</th></tr>
      </thead>
      <tbody id="eventsBody"></tbody>
    </table>
  </div>
</main>

<script>
const API = "";
let chart;

async function loadCommodities() {
  const res = await fetch(`${API}/api/commodities`);
  const commodities = await res.json();
  const sel = document.getElementById("commoditySelect");
  sel.innerHTML = commodities.map(c => `<option value="${c}">${c}</option>`).join("");
  sel.addEventListener("change", () => loadCommodity(sel.value));
  if (commodities.length) loadCommodity(commodities[0]);
}

function sentimentClass(score) {
  if (score > 0.15) return "sent-pos";
  if (score < -0.15) return "sent-neg";
  return "sent-neu";
}

async function loadCommodity(commodity) {
  const [pricesRes, eventsRes, briefRes] = await Promise.all([
    fetch(`${API}/api/prices?commodity=${encodeURIComponent(commodity)}`),
    fetch(`${API}/api/events?commodity=${encodeURIComponent(commodity)}`),
    fetch(`${API}/api/brief?commodity=${encodeURIComponent(commodity)}`),
  ]);
  const prices = await pricesRes.json();
  const events = await eventsRes.json();
  const brief = await briefRes.json();

  document.getElementById("latestPrice").textContent = brief.latest_price.toFixed(2);
  const changeEl = document.getElementById("changePct");
  changeEl.textContent = `${brief.change_pct > 0 ? "+" : ""}${brief.change_pct}%`;
  changeEl.className = brief.change_pct >= 0 ? "change-pos" : "change-neg";
  document.getElementById("briefText").textContent = brief.brief;

  const eventDates = new Set(events.map(e => e.date));
  const pointColors = prices.map(p => eventDates.has(p.date) ? "#f6ad55" : "rgba(79,209,197,0.6)");
  const pointRadii = prices.map(p => eventDates.has(p.date) ? 5 : 0);

  if (chart) chart.destroy();
  const ctx = document.getElementById("priceChart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: prices.map(p => p.date),
      datasets: [{
        label: commodity,
        data: prices.map(p => p.close),
        borderColor: "#4fd1c5",
        backgroundColor: "rgba(79,209,197,0.08)",
        fill: true,
        tension: 0.25,
        pointBackgroundColor: pointColors,
        pointRadius: pointRadii,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8fa1c2", maxTicksLimit: 8 }, grid: { color: "rgba(255,255,255,0.05)" } },
        y: { ticks: { color: "#8fa1c2" }, grid: { color: "rgba(255,255,255,0.05)" } },
      }
    }
  });

  const tbody = document.getElementById("eventsBody");
  tbody.innerHTML = events.map(e => `
    <tr>
      <td>${e.date}</td>
      <td><span class="tag">${e.category}</span></td>
      <td>${e.headline}</td>
      <td class="${sentimentClass(e.sentiment_score)}">${e.sentiment_score > 0 ? "+" : ""}${e.sentiment_score}</td>
      <td>${e.price_move_5d != null ? (e.price_move_5d > 0 ? "+" : "") + e.price_move_5d + "%" : "--"}</td>
    </tr>
  `).join("");
}

loadCommodities();
</script>
</body>
</html>
